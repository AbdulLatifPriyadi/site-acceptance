name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage publishable files
        run: |
          mkdir -p _site
          # Only the production app and its runtime assets go live.
          # Excluded on purpose:
          #   index-test.html          - mock-data build (DO NOT DEPLOY)
          #   SiteAcceptanceTracker.gs - Apps Script backend source
          #   backups/ scripts/ .github/
          cp index.html _site/
          cp bg-login.png walk.gif worker.webp _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
