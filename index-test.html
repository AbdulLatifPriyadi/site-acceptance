// --- Intercept fetch() ---
var _origFetch = window.fetch;
window.fetch = function(url, options) {
  var urlStr = typeof url === 'string' ? url : url.url || '';
  var isPost = options && options.method === 'POST';

  // Parse type from URL for GET, or body for POST
  var type = '';
  if (!isPost) {
    var m = urlStr.match(/type=([^&]+)/);
    if (m) type = m[1];
  } else {
    try {
      var body = JSON.parse(options.body || '{}');
      type = body.type || '';
    } catch(e) {}
  }

  // Build mock response
  var data;
  if (type === 'tracker' || urlStr.includes('type=tracker')) {
    data = MOCK_TRACKER;
  } else if (type === 'plan' || urlStr.includes('type=plan&')) {
    data = MOCK_PLAN;
  } else if (type === 'planDates') {
    data = ['2026-09-04', '2026-09-03', '2026-09-02', '2026-09-01'];
  } else if (type === 'activeDate') {
    data = { date: '2026-09-04' };
  } else if (type === 'planRoster') {
    data = { added: [], removed: [] };
  } else if (type === 'planRosterEdits') {
    data = {};
  } else if (type === 'clockin') {
    data = MOCK_CLOCKIN;
  } else if (type === 'clockinSubmit') {
    data = { status: 'ok' };
  } else {
    // Full log / messages
    data = [];
  }

  var res = new Response(JSON.stringify(data), {
    status: 200,
    headers: { 'Content-Type': 'application/json' }
  });
  res.ok = true;
  return Promise.resolve(res);
};
// Also override fetchWithTimeout (used by plan/data fetches)
